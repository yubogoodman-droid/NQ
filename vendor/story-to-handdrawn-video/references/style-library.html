与场景形成清楚节奏。","keywords":"故事叙事 其他","image":"style-examples/standard/hs-265.png"},{"id":"hs-266","type":"style","category":"gouache","name":"新自然系童话绘本插画","english":"Forest Children Storybook Illustration","summary":"新自然系童话绘本插画；孩子与自然环境共处；人物小巧可爱、造型圆润简洁；自然植物占据画面主体；嫩绿、草绿、深绿与少量暖色点缀；柔和自然光、树影斑驳、逆光透叶；雨露与水面高光；环境丰富但不过度写实；植物轮廓概括而有节奏；儿童绘本与动画背景结合；温暖、安静、清透、富有生命力；现代平面装饰型森林童话插画；高度二维化；圆润几何植物；大块纯色色形；弱透视、弱光影；简洁童真、安静治愈、装饰海报感","keywords":"故事叙事 其他","image":"style-examples/standard/hs-266.png"},{"id":"hs-267","type":"style","category":"line","name":"白底中国式极简手绘漫画","english":"Kobayashi Manga Minimal Ink Style","summary":"白底中国式极简手绘漫画；黑色毛笔/软头笔快速勾画；线条松散粗粝、粗细变化明显、略带断笔与手绘抖动；人物高度概括、比例略夸张、造型笨拙有趣；场景只保留最必要的物件与动作；大面积留白；黑色线稿为主体；脸颊、衣服或小道具加入少量红黄绿局部平涂；中国写意人物画与老式讽刺漫画的味道；","keywords":"故事叙事 其他","image":"style-examples/standard/hs-267.png"},{"id":"hs-268","type":"style","category":"diary","name":"现代生活人物·动物和日常小场景","english":"Contemporary Literati Ink Cartoon","summary":"现代生活人物、动物和日常小场景；白色或微暖纸面、大面积留白；毛笔和墨线快速画人物；线条松弛、粗细不一、枯湿自然、允许断笔和不闭合轮廓；人物高度概括、比例略笨拙，以姿态和动作表达情绪；人物是画面的主要视觉主体；场景保留少量必要元素；墨色为主，少量朱红、赭石、石绿、湖蓝局部点染；书法题字和朱红印章自然嵌入留白；整体拙朴、松弛、幽默、闲适；现代生活速写与中国写意笔墨结合","keywords":"故事叙事 其他","image":"style-examples/standard/hs-268.png"},{"id":"hs-269","type":"style","category":"print","name":"有力的铅笔轮廓·红黄暖色大形","english":"Socialist Realist Propaganda Poster","summary":"有力的铅笔轮廓、红黄暖色大形、明确人物姿态与版画颗粒；故事内容由当前原文决定。","keywords":"故事叙事 其他","image":"style-examples/standard/hs-269.png"},{"id":"hs-270","type":"style","category":"comic","name":"错透视·鲜艳平涂","english":"Chinese Farmers Painting","summary":"错透视、鲜艳平涂、大量留白。","keywords":"故事叙事 其他","image":"style-examples/standard/hs-270.png"},{"id":"hs-271","type":"style","category":"watercolor","name":"质朴细墨线·轻水彩平涂","english":"1980s-1990s Chinese Textbook Illustration","summary":"质朴细墨线、轻水彩平涂、自然人物比例、低饱和蓝绿和暖红；旧课本印刷的轻微颗粒。","keywords":"故事叙事 其他","image":"style-examples/standard/hs-271.png"},{"id":"hs-272","type":"style","category":"collage","name":"纸雕，角色高度概括·比例略夸张","english":"Paper Sculpture Illustration","summary":"纸雕，角色高度概括、比例略夸张、造型笨拙有趣；场景只保留最必要的物件与动作；大面积留白","keywords":"故事叙事 其他","image":"style-examples/standard/hs-272.png"},{"id":"hs-273","type":"style","category":"collage","name":"角色高度概括·比例略夸张","english":"Hand-Torn Paper Collage Illustration","summary":"角色高度概括、比例略夸张、造型笨拙有趣；场景只保留最必要的物件与动作；大面积留白","keywords":"故事叙事 其他","image":"style-examples/standard/hs-273.png"},{"id":"hs-274","type":"style","category":"graphic","name":"手绘火柴人漫画","english":"Hand-Drawn Stick Figure Cartoon","summary":"手绘火柴人漫画。人物必须采用真正的 stick figure anatomy：正常偏小的圆形头部，头部约占人物总高度 1/4～1/3；脖子、躯干、双臂、双腿主要由单根细黑线构成。肩、肘、膝只通过线条折角表达，手和脚极度简化。五官仅用两个小黑点眼睛、短线眉毛和极简单嘴型，发型用简单平涂。人物姿态依靠火柴线骨架的倾斜、弯曲、重心和四肢方向表达。黑色细手绘线条，轻微不规则，但整体清晰克制。上身/衣服用极简单的几何色块。背景根据主题使用低细节卡通，部分留白。","keywords":"故事叙事 其他","image":"style-examples/standard/hs-274.png"},{"id":"hs-275","type":"style","category":"print","name":"暖象牙色纤维旧纸底","english":"Vintage Risograph and Silkscreen Print Illustration","summary":"暖象牙色纤维旧纸底；深普鲁士蓝与灰珊瑚红限色双色套印；大量纸白留白与大面积负空间；手绘轮廓、蚀刻排线、断续干笔、粗颗粒半调网点、点描与平涂墨块塑形；墨色浓淡不均、磨损边缘、纸纹透出、轻微双色套印错位与局部掉墨；构图简洁疏朗，主体突出，背景层叠概括；20世纪中期复古旅行宣传插画与私人速写怀旧文学感","keywords":"故事叙事 其他","image":"style-examples/standard/hs-275.png"},{"id":"hs-276","type":"style","category":"graphic","name":"轮廓清晰的大面积平涂色块塑造形体","english":"Clean Airy Flat Vector Illustration","summary":"轮廓清晰的大面积平涂色块塑造形体；造型适度概括与圆润几何化，保留关键识别特征；每个区域最多两级平面明暗与清晰硬边阴影，通过色块明度、冷暖和面积对比表现空间层次；色彩明亮清爽、柔和通透，纯净平滑的画面质感；极简主义、简洁现代，具有轻盈的现代商业插画与编辑插画感","keywords":"故事叙事 其他","image":"style-examples/standard/hs-276.png"},{"id":"hs-277","type":"style","category":"animation","name":"中国老式手工木偶定格动画风","english":"Vintage Chinese Handmade Puppet Stop-Motion Animation","summary":"中国老式手工木偶定格动画风；东方传统手工人偶；细长且略显笨拙的人体比例；狭长脸型、细眉凤眼、极简手绘五官与淡淡胭脂；苍白哑光的纸偶、木偶与泥偶面部；粗糙毛发纤维；朴素粗布古装，剪裁质朴，保留明显布料纤维与手工针线缝制痕迹；实体微缩手工布景，微缩道具，背景疏朗开阔与大面积空处；低技术微缩定格动画摄影棚质感，轻微胶片颗粒与浅景深；古典中式民间传说与志怪故事气息","keywords":"故事叙事 其他","image":"style-examples/standard/hs-277.png"},{"id":"C-01","type":"palette","category":"blue","categoryName":"经典蓝系","name":"克莱因蓝","english":"Klein Blue","image":"style-examples ory":"warm","categoryName":"暖阳大地","name":"象牙白","english":"Ivory","image":"style-examples/standard/c-30.png","summary":"以象牙白为主要点缀色，保留所选画材的质感、明暗层次与清晰文字。","keywords":""}]}</script><script>
const data=JSON.parse(document.getElementById('catalog').textContent);const byId=id=>document.getElementById(id);let featured=true;
const categories=new Map(data.categories.map(c=>[c.id,c.name_zh]));for(const item of data.items)if(item.categoryName)categories.set(item.category,item.categoryName);
for(const [id,name] of categories){const option=document.createElement('option');option.value=id;option.textContent=name;byId('category').append(option)}
function element(tag,text,className){const node=document.createElement(tag);if(text)node.textContent=text;if(className)node.className=className;return node}
function render(){const query=byId('search').value.trim().toLowerCase(),type=byId('type').value,category=byId('category').value;
let items=featured?data.featured.map(id=>data.items.find(i=>i.id===id)):data.items;
items=items.filter(i=>(type==='all'||i.type===type)&&(!category||i.category===category)&&(!query||[i.name,i.english,i.id,i.summary,i.keywords].join(' ').toLowerCase().includes(query)));
byId('featured').setAttribute('aria-pressed',String(featured));byId('all').setAttribute('aria-pressed',String(!featured));byId('status').textContent=(featured?'常用精选':'完整目录')+' · '+items.length+' / 327 项';byId('grid').replaceChildren();
for(const item of items){const card=element('article',null,'card'),visual=element('div',null,'visual');if(item.image){const img=element('img');img.src=item.image;img.alt=item.name+' 示例';img.loading='lazy';const link=element('a');link.href=item.image;link.setAttribute('aria-label','放大查看 '+item.name);link.onclick=event=>{event.preventDefault();byId('preview-title').textContent=item.name;byId('preview-image').src=item.image;byId('preview-image').alt=item.name+' 原始示意图';byId('preview').showModal()};link.append(img);visual.append(link)}else{visual.append(element('div',item.type==='palette'?'主题配色配方':'画风配方 · 暂无本地示例图','empty'))}card.append(visual);
const body=element('div',null,'body');body.append(element('div',(categories.get(item.category)||item.category)+' / '+item.id,'badge'),element('h2',item.name),element('div',item.english,'english'),element('p',item.summary,'description'));
const command=(item.type==='style'?'--style ':'--palette ')+item.id,button=element('button',command+'  ·  复制','use');button.onclick=async()=>{try{await navigator.clipboard.writeText(command);byId('copied').textContent='已复制 '+command}catch{byId('copied').textContent='可复制命令：'+command}};body.append(button);card.append(body);byId('grid').append(card)}}
byId('featured').onclick=()=>{featured=true;byId('search').value='';byId('type').value='all';byId('category').value='';render()};byId('all').onclick=()=>{featured=false;render()};for(const id of ['search','type','category'])byId(id).addEventListener('input',()=>{featured=false;render()});render();
</script></body></html>
