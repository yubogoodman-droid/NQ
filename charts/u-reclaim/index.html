  };
  const r = mk(d.rsi12s, '#d28cff');
  mk(d.rsi6s, '#f0c14a');
  mk(d.rsi24s, '#7eb6ff');
  r.createPriceLine({ price:70, color:'rgba(227,93,93,0.45)', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dotted, axisLabelVisible:true, title:'70' });
  r.createPriceLine({ price:30, color:'rgba(61,186,122,0.45)', lineWidth:1, lineStyle:LightweightCharts.LineStyle.Dotted, axisLabelVisible:true, title:'30' });
  rsiChart.priceScale('right').applyOptions({ scaleMargins:{ top:0.08, bottom:0.08 } });
  rsiChart.timeScale().fitContent();
}

function render() {
  const d = DATA[current];
  const up = d.chg >= 0;
  document.getElementById('sym').textContent = d.symbol + '  ·  ' + d.interval;
  document.getElementById('tag').textContent = d.tag;
  document.getElementById('last').textContent = fmtPx(d.price);
  document.getElementById('last').style.color = up ? '#3dba7a' : '#e35d5d';
  document.getElementById('chg').textContent = (up?'+':'') + d.chg.toFixed(2) + '%  24h';
  document.getElementById('chg').style.color = up ? '#3dba7a' : '#e35d5d';
  const stats = [
    ['從低點彈', (d.bounce>=0?'+':'') + d.bounce.toFixed(2) + '%'],
    ['距 MA200', d.ext==null ? '—' : ((d.ext>=0?'+':'') + d.ext.toFixed(2) + '%')],
    ['均線黏度', d.cluster==null ? '—' : d.cluster.toFixed(3) + '%'],
    ['反彈量能', d.vol_ratio.toFixed(2) + 'x'],
    ['RSI(6)', d.rsi6==null?'—':d.rsi6.toFixed(1)],
    ['RSI(12)', d.rsi12==null?'—':d.rsi12.toFixed(1)],
    ['RSI(24)', d.rsi24==null?'—':d.rsi24.toFixed(1)],
    ['24h 成交', fmtM(d.qv24)],
  ];
  document.getElementById('stats').innerHTML = stats.map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
  renderChips();
  draw(d);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', render);
else render();
</script>
</body>
</html>
