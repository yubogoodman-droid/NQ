<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>完整三幕 · 今天 2 筆</title>
<style>
body{margin:0;background:#0c1210;color:#e8f0ea;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:20px 14px 48px}
h1{font-size:22px;margin:0 0 8px}
h2{font-size:16px;margin:0 0 10px}
.sub{color:#8aa193;line-height:1.65;margin:0 0 18px}
.card{background:#14201b;border:1px solid rgba(232,240,234,.12);border-radius:12px;padding:14px;margin-bottom:16px}
img{width:100%;height:auto;display:block;border-radius:8px;background:#101814}
.note{color:#8aa193;font-size:13px;margin:8px 0 0;line-height:1.5}
.pos{color:#3dba7a}
.mark{color:#c9a227}
</style></head>
<body>
<div class="wrap">
  <h1>今天符合完整三幕的只有 2 筆</h1>
  <p class="sub">
    圓 U 吻上黏帶 → 在帶子上趴一下 → 放量離開，長均還更黏。
    黃虛線是吻，綠虛線是離開。靜態圖，不用等套件。
  </p>

  <div class="card">
    <h2>NBIS 18:47 吻 → 18:56 離開 · 60m <span class="pos">+4.24%</span></h2>
    <img src="./img/NBIS_1847_lift.png" alt="NBIS 18:47"/>
    <p class="note">你那張截圖是 19:16。長均從 0.12% 收到 0.035%，價把短均帶走。</p>
  </div>

  <div class="card">
    <h2>UB 18:04 吻 → 18:16 離開 · 60m <span class="pos">+2.35%</span></h2>
    <img src="./img/UB_1804_lift.png" alt="UB 18:04"/>
    <p class="note">今天結構最接近的另一筆。吻的時候幾乎貼著（+0.02%），12 分鐘後放量走，長均收到 0.056%。</p>
  </div>
</div>
</body></html>
