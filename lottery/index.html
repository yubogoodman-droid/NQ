<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="幸運抽獎 — 韓日住宿、網卡、MyCard、貪婪之島卡等好禮，每人 3 次機會！" />
  <title>幸運抽獎 🎰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #0a1628;
      --bg-panel: #0f1f38;
      --bg-card: #122a4a;
      --border: #3d8bfd;
      --glow: #5eb3ff;
      --text: #e8f0ff;
      --muted: #8ba3c7;
      --gold: #ffd54f;
      --gold-dim: #c9a227;
      --success: #4ade80;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 70% 45% at 50% -5%, rgba(255, 213, 79, 0.12), transparent),
        radial-gradient(ellipse 50% 35% at 100% 80%, rgba(61, 139, 253, 0.15), transparent),
        var(--bg-deep);
      color: var(--text);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .header { text-align: center; margin-bottom: 1.5rem; }

    .logo {
      font-family: Orbitron, sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #fff, var(--gold), #ff9f43);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }

    .chances-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.25rem 0;
    }

    .chance-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .chance-dot.used {
      background: var(--gold);
      box-shadow: 0 0 12px rgba(255, 213, 79, 0.6);
    }

    .chances-text {
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
    }

    .chances-text strong { color: var(--gold); font-size: 1.3rem; }

    /* Slot machine */
    .machine {
      background: var(--bg-panel);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.06);
      margin-bottom: 1.25rem;
    }

    .machine-top {
      text-align: center;
      font-family: Orbitron, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--glow);
      margin-bottom: 0.75rem;
    }

    .reel-window {
      position: relative;
      height: 88px;
      overflow: hidden;
      border-radius: 12px;
      background: #060d18;
      border: 2px solid rgba(255, 213, 79, 0.35);
      box-shadow: inset 0 4px 20px rgba(0, 0, 0, 0.6);
    }

    .reel-window::before,
    .reel-window::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      height: 28px;
      z-index: 2;
      pointer-events: none;
    }

    .reel-window::before {
      top: 0;
      background: linear-gradient(to bottom, #060d18, transparent);
    }

    .reel-window::after {
      bottom: 0;
      background: linear-gradient(to top, #060d18, transparent);
    }

    .reel-highlight {
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 44px;
      transform: translateY(-50%);
      border-top: 1px solid rgba(255, 213, 79, 0.4);
      border-bottom: 1px solid rgba(255, 213, 79, 0.4);
      background: rgba(255, 213, 79, 0.06);
      z-index: 1;
      pointer-events: none;
    }

    .reel {
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      will-change: transform;
    }

    .reel-item {
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 1rem;
      font-weight: 700;
      padding: 0 0.75rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .reel-item .emoji { font-size: 1.3rem; flex-shrink: 0; }

    .draw-btn {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      color: #0a1628;
      background: linear-gradient(135deg, var(--gold), #ff9f43);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      box-shadow: 0 4px 20px rgba(255, 213, 79, 0.35);
    }

    .draw-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 28px rgba(255, 213, 79, 0.45);
    }

    .draw-btn:active:not(:disabled) { transform: translateY(0); }

    .draw-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      background: #4a5568;
      color: #a0aec0;
      box-shadow: none;
    }

    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 0.65rem;
      padding: 0.7rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px dashed rgba(61, 139, 253, 0.35);
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .reset-btn:hover {
      color: var(--glow);
      border-color: var(--border);
      background: rgba(61, 139, 253, 0.08);
    }

    /* Result popup */
    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .result-overlay.show { display: flex; }

    .result-card {
      background: var(--bg-panel);
      border: 2px solid var(--gold);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 60px rgba(255, 213, 79, 0.2);
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-emoji { font-size: 4rem; margin-bottom: 0.5rem; animation: bounce 0.6s ease; }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .result-label { color: var(--muted); font-size: 0.9rem; }
    .result-prize { font-size: 1.6rem; font-weight: 900; margin: 0.4rem 0 1.25rem; color: var(--gold); }

    .result-close {
      padding: 0.7rem 2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }

    .result-close:hover { background: rgba(255, 255, 255, 0.15); }

    /* Sections */
    .section {
      background: var(--bg-panel);
      border: 1px solid rgba(61, 139, 253, 0.2);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
    }

    .section h2 {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .prize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .prize-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.65rem;
      background: rgba(0, 0, 0, 0.25);
      border-radius: 10px;
      font-size: 0.82rem;
      border: 1px solid rgba(255, 255, 255, 0.06);
      color: var(--muted);
    }

    .prize-chip .emoji { font-size: 1.1rem; }

    .prize-chip.mystery {
      justify-content: center;
      letter-spacing: 0.08em;
    }

    .reel-item.mystery {
      color: var(--gold);
      letter-spacing: 0.15em;
      font-size: 1.15rem;
    }

    .history-list { list-style: none; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 0.9rem;
    }

    .history-item:last-child { border-bottom: none; }

    .history-round {
      font-family: Orbitron, sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      min-width: 2.5rem;
    }

    .history-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 0.5rem; }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .footer-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--glow);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .footer-link:hover { text-decoration: underline; }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 200;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 400px) {
      .prize-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1 class="logo">LUCKY DRAW</h1>
      <p class="subtitle">幸運抽獎 · 每人 3 次機會</p>
    </header>

    <div class="chances-bar" id="chances-bar" aria-label="剩餘抽獎次數"></div>
    <p class="chances-text">剩餘抽獎機會：<strong id="chances-left">3</strong> 次</p>

    <div class="machine">
      <div class="machine-top">▶ SPIN TO WIN ◀</div>
      <div class="reel-window">
        <div class="reel-highlight"></div>
        <div class="reel" id="reel"></div>
      </div>
      <button class="draw-btn" id="draw-btn">🎰 開始抽獎</button>
      <button class="reset-btn" id="reset-btn" type="button">🔄 再來一次（重置 3 次機會）</button>
    </div>

    <section class="section">
      <h2>🏆 獎品池</h2>
      <div class="prize-grid" id="prize-grid"></div>
      <p class="note">獎品名稱保密 · 抽中才揭曉 · 🏆 可能會再新增</p>
    </section>

    <section class="section">
      <h2>📋 我的抽獎紀錄</h2>
      <ul class="history-list" id="history"></ul>
    </section>

    <a class="footer-link" href="../">→ 貪婪之島咒語卡圖鑑</a>
  </div>

  <div class="result-overlay" id="result-overlay">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji"></div>
      <p class="result-label">恭喜獲得</p>
      <p class="result-prize" id="result-prize"></p>
      <button class="result-close" id="result-close">太棒了！</button>
    </div>
  </div>

  <script>
    const MAX_DRAWS = 3;
    const STORAGE_KEY = "lucky-draw-v1";

    const PRIZES = [
      { id: "kr-hotel",  name: "韓國住宿",       emoji: "🇰🇷" },
      { id: "jp-hotel",  name: "日本住宿",       emoji: "🇯🇵" },
      { id: "kr-sim",    name: "韓國網卡",       emoji: "📶" },
      { id: "jp-sim",    name: "日本網卡",       emoji: "📡" },
      { id: "mycard-1k", name: "MyCard 1000",    emoji: "💳" },
      { id: "mycard-1k2",name: "MyCard 1000",    emoji: "💳" },
      { id: "mycard-3k", name: "MyCard 3000",    emoji: "💎" },
      { id: "gi-card",   name: "貪婪之島卡抽獎", emoji: "🃏" },
    ];

    let state = loadState();
    let spinning = false;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { used: 0, history: [] };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function remaining() {
      return MAX_DRAWS - state.used;
    }

    function pickRandom() {
      return PRIZES[Math.floor(Math.random() * PRIZES.length)];
    }

    const MYSTERY_LABELS = ["🎁 ???", "✨ ???", "🏆 ???", "💎 ???", "🎰 ???", "🌟 ???"];

    function buildReel() {
      const reel = document.getElementById("reel");
      const items = [];
      for (let r = 0; r < 30; r++) {
        PRIZES.forEach(p => items.push(p));
      }
      reel.innerHTML = items.map((_, i) => {
        const label = MYSTERY_LABELS[i % MYSTERY_LABELS.length];
        return `<div class="reel-item mystery">${label}</div>`;
      }).join("");
      return items;
    }

    const reelItems = buildReel();
    const ITEM_H = 44;

    function setReelPosition(index) {
      const reel = document.getElementById("reel");
      const offset = index * ITEM_H - (88 - ITEM_H) / 2;
      reel.style.transition = "none";
      reel.style.transform = `translateY(-${offset}px)`;
    }

    setReelPosition(Math.floor(reelItems.length / 2));

    function renderChances() {
      const bar = document.getElementById("chances-bar");
      bar.innerHTML = Array.from({ length: MAX_DRAWS }, (_, i) =>
        `<div class="chance-dot ${i < state.used ? "used" : ""}" title="第 ${i + 1} 次"></div>`
      ).join("");
      document.getElementById("chances-left").textContent = remaining();
      const btn = document.getElementById("draw-btn");
      if (remaining() <= 0) {
        btn.disabled = true;
        btn.textContent = "抽獎機會已用完";
      } else if (spinning) {
        btn.disabled = true;
        btn.textContent = "抽獎中…";
      } else {
        btn.disabled = false;
        btn.textContent = "🎰 開始抽獎";
      }
    }

    function renderPrizes() {
      document.getElementById("prize-grid").innerHTML = PRIZES.map((_, i) =>
        `<div class="prize-chip mystery"><span class="emoji">🎁</span><span>神秘獎品 #${i + 1}</span></div>`
      ).join("");
    }

    function renderHistory() {
      const el = document.getElementById("history");
      if (state.history.length === 0) {
        el.innerHTML = `<li class="history-empty">尚未抽獎，快來試試手氣！</li>`;
        return;
      }
      el.innerHTML = state.history.map((h, i) =>
        `<li class="history-item">
          <span class="history-round">#${i + 1}</span>
          <span class="emoji">${h.emoji}</span>
          <span>${h.name}</span>
        </li>`
      ).join("");
    }

    function confetti() {
      const colors = ["#ffd54f", "#ff6b6b", "#4ade80", "#60a5fa", "#c084fc", "#ff9f43"];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (1.5 + Math.random() * 2) + "s";
        el.style.animationDelay = Math.random() * 0.5 + "s";
        el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    function showResult(prize) {
      document.getElementById("result-emoji").textContent = prize.emoji;
      document.getElementById("result-prize").textContent = prize.name;
      document.getElementById("result-overlay").classList.add("show");
      confetti();
    }

    async function spin() {
      if (spinning || remaining() <= 0) return;
      spinning = true;
      renderChances();

      const winner = pickRandom();
      const reel = document.getElementById("reel");

      const baseIdx = Math.floor(reelItems.length / 2);
      let targetIdx = baseIdx;
      for (let i = baseIdx; i < reelItems.length; i++) {
        if (reelItems[i].id === winner.id) { targetIdx = i; break; }
      }
      const extraRounds = PRIZES.length * 4;
      targetIdx += extraRounds * PRIZES.length;
      if (targetIdx >= reelItems.length - 5) {
        targetIdx = baseIdx + extraRounds * PRIZES.length;
        while (targetIdx < reelItems.length && reelItems[targetIdx].id !== winner.id) targetIdx++;
      }

      const offset = targetIdx * ITEM_H - (88 - ITEM_H) / 2;

      reel.style.transition = "transform 3.2s cubic-bezier(0.15, 0.85, 0.2, 1)";
      reel.style.transform = `translateY(-${offset}px)`;

      await new Promise(r => setTimeout(r, 3400));

      state.used++;
      state.history.push({ id: winner.id, name: winner.name, emoji: winner.emoji });
      saveState();

      spinning = false;
      renderChances();
      renderHistory();
      showResult(winner);
    }

    function resetDraws() {
      if (spinning) return;
      if (state.used === 0 && state.history.length === 0) return;
      if (!confirm("確定要重置嗎？會清空抽獎紀錄並恢復 3 次機會。")) return;
      state = { used: 0, history: [] };
      saveState();
      document.getElementById("result-overlay").classList.remove("show");
      renderChances();
      renderHistory();
    }

    document.getElementById("draw-btn").addEventListener("click", spin);
    document.getElementById("reset-btn").addEventListener("click", resetDraws);
    document.getElementById("result-close").addEventListener("click", () => {
      document.getElementById("result-overlay").classList.remove("show");
    });
    document.getElementById("result-overlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove("show");
    });

    renderChances();
    renderPrizes();
    renderHistory();
  </script>
</body>
</html>
