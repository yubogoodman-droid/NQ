        return `<button class="chip${i===current?' active':''}" data-i="${i}">
          <b>${d.base}</b><span class="px">${d.interval}</span>
          <span class="${up?'up':'dn'}">${up?'+':''}${d.chg.toFixed(2)}%</span>
        </button>`;
      }).join('');
      el('chips').querySelectorAll('.chip').forEach(btn => {
        btn.onclick = () => { current = Number(btn.dataset.i); render(); };
      });
    }

    function ytickformat(price) {
      if (price >= 100) return '.2f';
      if (price >= 1) return '.4f';
      if (price >= 0.1) return '.5f';
      return '.6f';
    }

    function renderChart(d) {
      const inc = '#0ecb81', dec = '#f6465d';
      const traces = [
        {
          type: 'candlestick', x: d.t, open: d.o, high: d.h, low: d.l, close: d.c,
          name: d.symbol, increasing: {line: {color: inc}, fillcolor: inc},
          decreasing: {line: {color: dec}, fillcolor: dec},
          whiskerwidth: 0.8, xaxis: 'x', yaxis: 'y'
        },
        {type:'scatter', mode:'lines', x:d.t, y:d.ma7s, name:'MA7', line:{color:'#f0b90b', width:1.2}, hoverinfo:'skip', xaxis:'x', yaxis:'y'},
        {type:'scatter', mode:'lines', x:d.t, y:d.ma25s, name:'MA25', line:{color:'#e040fb', width:1.2}, hoverinfo:'skip', xaxis:'x', yaxis:'y'},
        {type:'scatter', mode:'lines', x:d.t, y:d.ma99s, name:'MA99', line:{color:'#00bcd4', width:1.1}, hoverinfo:'skip', xaxis:'x', yaxis:'y'},
        {type:'scatter', mode:'lines', x:d.t, y:d.ma120s, name:'MA120', line:{color:'#26a69a', width:1.1}, hoverinfo:'skip', xaxis:'x', yaxis:'y'},
        {type:'scatter', mode:'lines', x:d.t, y:d.ma200s, name:'MA200', line:{color:'#42a5f5', width:1.4}, hoverinfo:'skip', xaxis:'x', yaxis:'y'},
        {type:'bar', x:d.t, y:d.v, name:'成交量', marker:{color:d.vol_colors}, xaxis:'x2', yaxis:'y2', hoverinfo:'skip'},
        {type:'scatter', mode:'lines', x:d.t, y:d.r6s, name:'RSI6', line:{color:'#f0b90b', width:1.2}, xaxis:'x3', yaxis:'y3'},
        {type:'scatter', mode:'lines', x:d.t, y:d.r12s, name:'RSI12', line:{color:'#e040fb', width:1.2}, xaxis:'x3', yaxis:'y3'},
        {type:'scatter', mode:'lines', x:d.t, y:d.r24s, name:'RSI24', line:{color:'#42a5f5', width:1.2}, xaxis:'x3', yaxis:'y3'},
      ];
      if (d.low_time) {
        traces.push({
          type:'scatter', mode:'markers+text', x:[d.low_time], y:[d.low_price],
          marker:{size:10, color:'#42a5f5', line:{color:'#fff', width:1}},
          text:['低點'], textposition:'bottom center',
          name:'局部低點', xaxis:'x', yaxis:'y'
        });
      }
      const layout = {
        paper_bgcolor: '#161a1e',
        plot_bgcolor: '#161a1e',
        font: {color:'#eaecef', family:'-apple-system, BlinkMacSystemFont, Segoe UI, Noto Sans TC, sans-serif'},
        margin: {l:56, r:16, t:12, b:40},
        showlegend: false,
        hovermode: 'x unified',
        xaxis:  {domain:[0,1], anchor:'y',  rangeslider:{visible:false}, showticklabels:false, showgrid:true, gridcolor:'rgba(255,255,255,0.05)', linecolor:'#2b3139', zeroline:false},
        xaxis2: {domain:[0,1], anchor:'y2', matches:'x', showticklabels:false, showgrid:true, gridcolor:'rgba(255,255,255,0.05)', linecolor:'#2b3139'},
        xaxis3: {domain:[0,1], anchor:'y3', matches:'x', showgrid:true, gridcolor:'rgba(255,255,255,0.05)', linecolor:'#2b3139', tickangle:-30, tickfont:{size:10, color:'#848e9c'}},
        yaxis:  {domain:[0.38, 1.0], showgrid:true, gridcolor:'rgba(255,255,255,0.06)', tickformat: ytickformat(d.price), side:'right', tickfont:{size:11}},
        yaxis2: {domain:[0.20, 0.36], showgrid:false, side:'right', tickfont:{size:10, color:'#848e9c'}, title:{text:'VOL', font:{size:10, color:'#848e9c'}}},
        yaxis3: {domain:[0.0, 0.18], range:[0,100], showgrid:true, gridcolor:'rgba(255,255,255,0.06)', side:'right', tickfont:{size:10}, title:{text:'RSI', font:{size:10, color:'#848e9c'}}},
        shapes: [
          {type:'line', xref:'x3', yref:'y3', x0:d.t[0], x1:d.t[d.t.length-1], y0:70, y1:70, line:{color:'rgba(246,70,93,0.35)', dash:'dot', width:1}},
          {type:'line', xref:'x3', yref:'y3', x0:d.t[0], x1:d.t[d.t.length-1], y0:30, y1:30, line:{color:'rgba(14,203,129,0.35)', dash:'dot', width:1}},
        ],
      };
      Plotly.react('chart', traces, layout, {responsive:true, displayModeBar:false});
    }

    function render() {
      const d = DATA[current];
      const up = d.chg >= 0;
      el('sym').textContent = d.symbol + '  ·  ' + d.interval;
      el('tag').textContent = d.tag;
      el('last').textContent = fmtPx(d.price);
      el('last').style.color = up ? '#0ecb81' : '#f6465d';
      el('chg').textContent = (up?'+':'') + d.chg.toFixed(2) + '%  24h';
      el('chg').style.color = up ? '#0ecb81' : '#f6465d';
      const stats = [
        ['從低點彈', (d.bounce>=0?'+':'') + d.bounce.toFixed(2) + '%'],
        ['距 MA200', d.ext==null ? '—' : ((d.ext>=0?'+':'') + d.ext.toFixed(2) + '%')],
        ['均線黏度', d.cluster==null ? '—' : d.cluster.toFixed(3) + '%'],
        ['反彈量能', d.vol_ratio.toFixed(2) + 'x'],
        ['RSI(6)', fmtRsi(d.rsi6)],
        ['RSI(12)', fmtRsi(d.rsi12)],
        ['RSI(24)', fmtRsi(d.rsi24)],
        ['24h 成交', fmtM(d.qv24)],
      ];
      el('stats').innerHTML = stats.map(([k,v]) => `<div class="stat"><div class="k">${k}</div><div class="v">${v}</div></div>`).join('');
      renderChips();
      renderChart(d);
    }
    render();
    window.addEventListener('resize', () => Plotly.Plots.resize('chart'));
  </script>
</body>
</html>
