<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="description" content="幸運抽獎 — 神秘好禮，共 3 次機會！" />
  <title>幸運抽獎 · For My Wife Patty 🎰</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Orbitron:wght@500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-deep: #fff8ef;
      --bg-panel: #ffffff;
      --bg-card: #fff4e5;
      --border: #ff9f43;
      --glow: #ff7a18;
      --text: #2b2118;
      --muted: #8a7460;
      --gold: #e89a0c;
      --gold-bright: #ffb020;
      --success: #2db86a;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(255, 176, 32, 0.35), transparent),
        radial-gradient(ellipse 55% 40% at 100% 90%, rgba(255, 122, 24, 0.12), transparent),
        radial-gradient(ellipse 40% 30% at 0% 70%, rgba(255, 159, 67, 0.1), transparent),
        linear-gradient(180deg, #fffaf2 0%, #ffe9c8 55%, #fff4e0 100%);
      color: var(--text);
      font-family: "Noto Sans TC", -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .wrap {
      max-width: 560px;
      margin: 0 auto;
      padding: 1.5rem 1.25rem 3rem;
    }

    .header { text-align: center; margin-bottom: 1.5rem; }

    .logo {
      font-family: Orbitron, sans-serif;
      font-size: clamp(1.6rem, 6vw, 2.4rem);
      font-weight: 700;
      background: linear-gradient(135deg, #ff7a18, var(--gold), #ffcf4d);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .subtitle { color: var(--muted); margin-top: 0.4rem; font-size: 0.95rem; }

    .chances-bar {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin: 1.25rem 0;
    }

    .chance-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 2px solid var(--gold);
      background: transparent;
      transition: background 0.3s, box-shadow 0.3s;
    }

    .chance-dot.used {
      background: var(--gold-bright);
      box-shadow: 0 0 10px rgba(255, 176, 32, 0.55);
    }

    .chances-text {
      text-align: center;
      font-size: 1.05rem;
      margin-bottom: 1.25rem;
    }

    .chances-text strong { color: var(--gold); font-size: 1.3rem; }

    /* Lucky wheel */
    .machine {
      background: var(--bg-panel);
      border: 2px solid rgba(255, 159, 67, 0.45);
      border-radius: var(--radius);
      padding: 1.25rem 1.25rem 1.35rem;
      box-shadow: 0 10px 28px rgba(255, 122, 24, 0.12), 0 2px 8px rgba(43, 33, 24, 0.06);
      margin-bottom: 1.25rem;
    }

    .machine-top {
      text-align: center;
      font-family: Orbitron, sans-serif;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      color: var(--glow);
      margin-bottom: 0.85rem;
    }

    .wheel-stage {
      position: relative;
      width: min(320px, 78vw);
      margin: 0 auto 0.35rem;
      aspect-ratio: 1;
    }

    .wheel-pointer {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: 0;
      height: 0;
      border-left: 14px solid transparent;
      border-right: 14px solid transparent;
      border-top: 28px solid #ff7a18;
      filter: drop-shadow(0 3px 4px rgba(0, 0, 0, 0.2));
    }

    .wheel-pointer::after {
      content: "";
      position: absolute;
      top: -28px;
      left: -7px;
      width: 14px;
      height: 14px;
      background: #fff;
      border: 3px solid #ff7a18;
      border-radius: 50%;
    }

    .wheel-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      padding: 10px;
      background:
        conic-gradient(from 0deg, #ffb020, #ff7a18, #ffcf4d, #ff9f43, #ffb020);
      box-shadow:
        0 10px 28px rgba(255, 122, 24, 0.28),
        inset 0 0 0 3px rgba(255, 255, 255, 0.55);
    }

    .wheel {
      position: absolute;
      inset: 10px;
      border-radius: 50%;
      overflow: hidden;
      background: #fff8ef;
      transition: none;
      will-change: transform;
      box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.8);
    }

    .wheel.spinning {
      filter: saturate(1.08);
    }

    .wheel-segment-label {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 46%;
      transform-origin: left center;
      text-align: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #3a2a1a;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      line-height: 1.15;
      padding-left: 18%;
    }

    .wheel-segment-label .emoji { font-size: 0.95rem; }
    .wheel-segment-label.mystery { color: #c45c26; }

    .wheel-center {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 4;
      width: 64px;
      height: 64px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #ffe2a8);
      border: 4px solid #ff9f43;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
      display: grid;
      place-items: center;
      font-size: 1.5rem;
    }

    .wheel-glow {
      position: absolute;
      inset: -8px;
      border-radius: 50%;
      pointer-events: none;
      opacity: 0;
      background: radial-gradient(circle, rgba(255, 176, 32, 0.35), transparent 70%);
      transition: opacity 0.3s;
    }

    .wheel-stage.spinning .wheel-glow { opacity: 1; animation: glowPulse 0.6s ease-in-out infinite; }

    @keyframes glowPulse {
      0%, 100% { transform: scale(1); opacity: 0.55; }
      50% { transform: scale(1.04); opacity: 1; }
    }

    .draw-btn {
      display: block;
      width: 100%;
      margin-top: 1rem;
      padding: 1rem;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #ff7a18, #ffb020);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, opacity 0.2s;
      box-shadow: 0 6px 18px rgba(255, 122, 24, 0.35);
    }

    .draw-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 24px rgba(255, 122, 24, 0.4);
    }

    .draw-btn:active:not(:disabled) { transform: translateY(0); }

    .draw-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      background: #d4c4b0;
      color: #8a7a68;
      box-shadow: none;
    }

    .reset-btn {
      display: block;
      width: 100%;
      margin-top: 0.65rem;
      padding: 0.7rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: 1px dashed rgba(255, 122, 24, 0.4);
      border-radius: 10px;
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
    }

    .reset-btn:hover {
      color: var(--glow);
      border-color: var(--border);
      background: rgba(255, 159, 67, 0.1);
    }

    /* Result popup */
    .result-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(255, 248, 239, 0.72);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 1.25rem;
    }

    .result-overlay.show { display: flex; }

    .result-card {
      background: #fff;
      border: 2px solid var(--gold-bright);
      border-radius: 20px;
      padding: 2rem 1.5rem;
      text-align: center;
      max-width: 360px;
      width: 100%;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 16px 40px rgba(255, 122, 24, 0.2);
      max-height: min(90vh, 720px);
      overflow-y: auto;
    }

    .result-card.spell-mode {
      max-width: 400px;
      padding: 1.35rem 1.15rem 1.5rem;
    }

    /* Chinese Greed Island card face */
    .gi-face {
      display: none;
      margin: 0.35rem auto 0.75rem;
      width: min(280px, 82vw);
      aspect-ratio: 280 / 400;
      border-radius: 6px;
      padding: 7px;
      background: linear-gradient(160deg, #1a1a1a 0%, #0a0a0a 40%, #1c2433 100%);
      box-shadow: 0 10px 28px rgba(43, 33, 24, 0.18);
      animation: bounce 0.6s ease;
      text-align: left;
    }

    .gi-face.show { display: block; }

    .gi-inner {
      height: 100%;
      display: flex;
      flex-direction: column;
      background: #0b1220;
      border: 2px solid #2a3f63;
      border-radius: 4px;
      overflow: hidden;
    }

    .gi-head {
      display: grid;
      grid-template-columns: 48px 1fr 54px;
      align-items: center;
      gap: 0.2rem;
      padding: 0.4rem 0.45rem;
      background: linear-gradient(180deg, #f7f4ea 0%, #ebe4d2 100%);
      color: #1a1a1a;
      border-bottom: 2px solid #2a3f63;
      min-height: 2.9rem;
    }

    .gi-no { font-family: Orbitron, sans-serif; font-size: 0.72rem; font-weight: 700; }
    .gi-title { text-align: center; font-size: 1.2rem; font-weight: 900; line-height: 1.15; letter-spacing: 0.05em; }
    .gi-title small { display: block; font-size: 0.58rem; font-weight: 500; color: #666; margin-bottom: 0.05rem; }
    .gi-rank { text-align: right; font-family: Orbitron, sans-serif; font-size: 0.72rem; font-weight: 700; }

    .gi-art {
      position: relative;
      flex: 1.05;
      min-height: 0;
      background: #000;
      overflow: hidden;
      border-bottom: 2px solid #2a3f63;
    }

    .gi-art img {
      width: 100%;
      height: 155%;
      object-fit: cover;
      object-position: center 40%;
      display: block;
      transform: translateY(-8%);
    }

    .gi-text {
      flex: 0.95;
      min-height: 0;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at 20% 20%, rgba(120,180,255,0.18), transparent 40%),
        radial-gradient(circle at 80% 80%, rgba(80,140,220,0.16), transparent 45%),
        #dce8f7;
      padding: 0.45rem;
    }

    .gi-desc-box {
      flex: 1;
      background: #fff;
      border: 1px solid #9bb4d4;
      border-radius: 3px;
      padding: 0.4rem 0.45rem;
      overflow: auto;
    }

    .gi-desc {
      color: #1c2433;
      font-size: 0.8rem;
      line-height: 1.45;
      font-weight: 500;
      white-space: pre-wrap;
    }

    .gi-icons {
      display: flex;
      justify-content: flex-end;
      gap: 0.28rem;
      margin-top: 0.3rem;
    }

    .gi-icon {
      width: 1.45rem;
      height: 1.45rem;
      border-radius: 50%;
      border: 1.5px solid #2a3f63;
      background: #fff;
      color: #1a2436;
      font-size: 0.68rem;
      font-weight: 800;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .gi-icon.range { background: #e8f4ff; }

    .spell-scan-note {
      display: none;
      margin: 0.15rem auto 0.85rem;
      font-size: 0.78rem;
      color: var(--muted);
      text-align: left;
      max-width: min(280px, 82vw);
      border: 1px solid rgba(255, 159, 67, 0.3);
      border-radius: 10px;
      padding: 0.45rem 0.65rem;
      background: #fffaf2;
    }

    .spell-scan-note.show { display: block; }

    .spell-scan-note summary {
      cursor: pointer;
      font-weight: 500;
      list-style: none;
    }

    .spell-scan-note summary::-webkit-details-marker { display: none; }

    .spell-scan-note .result-card-img {
      width: 100%;
      margin: 0.55rem auto 0.15rem;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.7); }
      to { opacity: 1; transform: scale(1); }
    }

    .result-emoji { font-size: 4rem; margin-bottom: 0.5rem; animation: bounce 0.6s ease; }

    .result-emoji.hidden { display: none; }

    @keyframes bounce {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    .result-label { color: var(--muted); font-size: 0.9rem; margin-bottom: 0.35rem; }
    .result-prize { font-size: 1.6rem; font-weight: 900; margin: 0.4rem 0 1.25rem; color: var(--glow); }
    .result-card.spell-mode .result-close { margin-top: 0.35rem; }

    .result-card-img {
      display: none;
      width: min(220px, 70vw);
      margin: 0.4rem auto 0.85rem;
      border-radius: 12px;
      border: 2px solid rgba(61, 139, 253, 0.55);
      box-shadow: 0 8px 24px rgba(43, 33, 24, 0.12);
      background: #0a1424;
    }

    .result-card-img.show { display: block; animation: bounce 0.6s ease; }

    .result-sub {
      display: none;
      margin: -0.75rem 0 1.1rem;
      color: var(--muted);
      font-size: 0.9rem;
    }

    .result-sub.show { display: block; }

    .result-close {
      padding: 0.7rem 2rem;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      background: #fff4e5;
      border: 1px solid rgba(255, 159, 67, 0.4);
      border-radius: 10px;
      color: var(--text);
      cursor: pointer;
    }

    .result-close:hover { background: #ffe8c8; }

    /* Sections */
    .section {
      background: var(--bg-panel);
      border: 1px solid rgba(255, 159, 67, 0.25);
      border-radius: var(--radius);
      padding: 1rem 1.1rem;
      margin-bottom: 1rem;
      box-shadow: 0 4px 14px rgba(43, 33, 24, 0.04);
    }

    .section h2 {
      font-size: 0.85rem;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 0.75rem;
      letter-spacing: 0.05em;
    }

    .prize-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0.5rem;
    }

    .prize-chip {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.55rem 0.65rem;
      background: #fff8ef;
      border-radius: 10px;
      font-size: 0.82rem;
      border: 1px solid rgba(255, 159, 67, 0.2);
      color: var(--muted);
    }

    .prize-chip .emoji { font-size: 1.1rem; }

    .prize-chip.mystery {
      justify-content: center;
      letter-spacing: 0.08em;
    }

    .history-list { list-style: none; }

    .history-item {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.6rem 0;
      border-bottom: 1px solid rgba(255, 159, 67, 0.15);
      font-size: 0.9rem;
    }

    .history-item:last-child { border-bottom: none; }

    .history-round {
      font-family: Orbitron, sans-serif;
      font-size: 0.72rem;
      color: var(--muted);
      min-width: 2.5rem;
    }

    .history-empty { color: var(--muted); font-size: 0.88rem; text-align: center; padding: 0.5rem; }

    .note {
      text-align: center;
      color: var(--muted);
      font-size: 0.8rem;
      margin-top: 0.5rem;
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      top: -10px;
      z-index: 200;
      pointer-events: none;
      animation: fall linear forwards;
    }

    @keyframes fall {
      to { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }

    @media (max-width: 400px) {
      .prize-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="header">
      <h1 class="logo">LUCKY DRAW</h1>
      <p class="subtitle">For My Wife Patty · 3 次機會</p>
    </header>

    <div class="chances-bar" id="chances-bar" aria-label="剩餘抽獎次數"></div>
    <p class="chances-text">剩餘抽獎機會：<strong id="chances-left">3</strong> 次</p>

    <div class="machine">
      <div class="machine-top">▶ SPIN TO WIN ◀</div>
      <div class="wheel-stage" id="wheel-stage">
        <div class="wheel-glow"></div>
        <div class="wheel-pointer" aria-hidden="true"></div>
        <div class="wheel-ring">
          <div class="wheel" id="wheel"></div>
        </div>
        <div class="wheel-center">🎰</div>
      </div>
      <button class="draw-btn" id="draw-btn">🎰 開始抽獎</button>
      <button class="reset-btn" id="reset-btn" type="button">🔄 再來一次（重置 3 次機會）</button>
    </div>

    <section class="section">
      <h2>🏆 獎品池</h2>
      <div class="prize-grid" id="prize-grid"></div>
      <p class="note">部分獎品保密 · 抽中才揭曉</p>
    </section>

    <section class="section">
      <h2>📋 我的抽獎紀錄</h2>
      <ul class="history-list" id="history"></ul>
    </section>
  </div>

  <div class="result-overlay" id="result-overlay">
    <div class="result-card" id="result-card">
      <p class="result-label" id="result-label">恭喜獲得</p>
      <div class="result-emoji" id="result-emoji"></div>
      <div class="gi-face" id="spell-face">
        <div class="gi-inner">
          <div class="gi-head">
            <div class="gi-no" id="spell-face-no"></div>
            <div class="gi-title" id="spell-face-name"></div>
            <div class="gi-rank" id="spell-face-rank"></div>
          </div>
          <div class="gi-art">
            <img id="spell-face-art" alt="" />
          </div>
          <div class="gi-text">
            <div class="gi-desc-box">
              <p class="gi-desc" id="spell-face-desc"></p>
            </div>
            <div class="gi-icons" id="spell-face-icons"></div>
          </div>
        </div>
      </div>
      <img class="result-card-img" id="result-card-img" alt="" />
      <details class="spell-scan-note" id="spell-scan-note">
        <summary>查看原版日文掃描</summary>
        <img class="result-card-img show" id="result-scan-img" alt="" />
      </details>
      <p class="result-prize" id="result-prize"></p>
      <p class="result-sub" id="result-sub"></p>
      <button class="result-close" id="result-close">太棒了！</button>
    </div>
  </div>

  <script>
    const MAX_DRAWS = 3;
    const STORAGE_KEY = "lucky-draw-v4";

    const PRIZES = [
      { id: "kr-hotel",  name: "韓國住宿",       emoji: "🇰🇷", weight: 1, reveal: true },
      { id: "jp-hotel",  name: "日本住宿",       emoji: "🇯🇵", weight: 1, reveal: true },
      { id: "kr-sim",    name: "韓國網卡",       emoji: "📶", weight: 1, reveal: true },
      { id: "jp-sim",    name: "日本網卡",       emoji: "📡", weight: 1, reveal: true },
      { id: "mycard-1k", name: "MyCard 1000",    emoji: "💳", weight: 1, reveal: true },
      { id: "mycard-3k", name: "MyCard 3000",    emoji: "💎", weight: 1, reveal: true },
      { id: "dragon-chain", name: "龍鍊",        emoji: "🐉", weight: 1, image: "prizes/IMG_4123.jpeg" },
      { id: "gi-card",   name: "貪婪之島卡抽獎", emoji: "🃏", weight: 1, spellDraw: true },
    ];

    const SPELL_CARDS = [
      { id: 1001, name: "盜視", nameJp: "盗視", rank: "G", limit: 200, range: "long", desc: "查看一位目標玩家的所有自由卡槽。（僅限於在遊戲中遇到過的玩家）" },
      { id: 1002, name: "透視", nameJp: "透視", rank: "F", limit: 150, range: "long", desc: "查看一位目標玩家的所有指定卡槽。（僅限於在遊戲中遇到過的玩家）" },
      { id: 1003, name: "防壁", nameJp: "ディフェンシブウォール", rank: "G", limit: 400, range: "short", desc: "防止一次來自其他玩家的攻擊咒文。" },
      { id: 1004, name: "反射", nameJp: "リフレクト", rank: "E", limit: 120, range: "short", desc: "擊退其他玩家的攻擊咒文，並將效果返回給對方。" },
      { id: 1005, name: "磁力", nameJp: "マグネティックフォース", rank: "C", limit: 50, range: "long", desc: "飛到指定玩家（僅限於在遊戲中遇到過的玩家）所在的地點。" },
      { id: 1006, name: "掏摸", nameJp: "ピックポケット", rank: "F", limit: 170, range: "short", desc: "隨機從另一位玩家的自由卡槽竊取一張卡。" },

    let state = loadState();
    let spinning = false;

    function pickSpellCard() {
      return SPELL_CARDS[Math.floor(Math.random() * SPELL_CARDS.length)];
    }

    function spellImageSrc(id) {
      // gh-pages: images at site root; docs preview: under greed-island/
      return `../images/modal/${id}.webp`;
    }

    function rangeLabel(range) {
      return range === "long" ? "遠距離" : "近距離";
    }

    function resolvePrize(base) {
      if (!base.spellDraw) return { ...base };
      const card = pickSpellCard();
      return {
        ...base,
        spellCard: card,
        name: `貪婪之島卡 · ${card.name}`,
        displayName: card.name,
        sub: `NO.${card.id} · ${card.rank} 級 · ${rangeLabel(card.range)}`,
      };
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
      } catch {}
      return { used: 0, history: [] };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function remaining() {
      return MAX_DRAWS - state.used;
    }

    function wonPrizeIds() {
      return new Set(state.history.map(h => h.id));
    }

    function pickRandom(forceSpell = false) {
      if (forceSpell) {
        return PRIZES.find(p => p.spellDraw) || PRIZES[PRIZES.length - 1];
      }
      const won = wonPrizeIds();
      // 前兩次排除貪婪之島，且每個獎項只能中一次
      const pool = PRIZES.filter(p => !p.spellDraw && !won.has(p.id));
      if (pool.length === 0) {
        return PRIZES.find(p => !p.spellDraw) || PRIZES[0];
      }
      const total = pool.reduce((sum, p) => sum + (p.weight || 1), 0);
      let roll = Math.random() * total;
      for (const prize of pool) {
        roll -= (prize.weight || 1);
        if (roll <= 0) return prize;
      }
      return pool[pool.length - 1];
    }

    const SEGMENT_COLORS = [
      "#FFE08A", "#FFB347", "#FFD6A5", "#FFCC80",
      "#FFF3B0", "#FFAB76", "#FFE5B4", "#FFC4A3",
    ];

    let wheelAngle = 0;

    function segmentAngle() {
      return 360 / PRIZES.length;
    }

    // 扇形中心相對「上方指針」的角度（順時針，0 = 正上）
    function segmentCenterDeg(index) {
      const seg = segmentAngle();
      return index * seg + seg / 2;
    }

    function shortPrizeLabel(prize, mysteryNo) {
      if (prize.reveal) return prize.name;
      return `神秘${mysteryNo}`;
    }

    function buildWheel() {
      const wheel = document.getElementById("wheel");
      const n = PRIZES.length;
      const seg = segmentAngle();
      let mysteryNo = 0;

      // conic-gradient: 0deg = 正上方，順時針
      const gradient = PRIZES.map((_, i) => {
        const color = SEGMENT_COLORS[i % SEGMENT_COLORS.length];
        return `${color} ${i * seg}deg ${(i + 1) * seg}deg`;
      }).join(", ");
      wheel.style.background = `conic-gradient(from 0deg, ${gradient})`;

      // CSS rotate(0) 是朝右，所以文字角度要再 -90deg 才會對到正上
      wheel.innerHTML = PRIZES.map((p, i) => {
        if (!p.reveal) mysteryNo += 1;
        const visualDeg = segmentCenterDeg(i); // 0 = top
        const cssRot = visualDeg - 90;        // convert to CSS axis
        const cls = p.reveal ? "wheel-segment-label" : "wheel-segment-label mystery";
        const flip = visualDeg > 90 && visualDeg < 270;
        const emoji = p.reveal ? p.emoji : "🎁";
        const label = shortPrizeLabel(p, mysteryNo);
        const inner = flip
          ? `<span style="transform:rotate(180deg);display:inline-flex;align-items:center;gap:0.2rem"><span>${label}</span><span class="emoji">${emoji}</span></span>`
          : `<span class="emoji">${emoji}</span><span>${label}</span>`;
        return `<div class="${cls}" style="transform: rotate(${cssRot}deg) translateY(-50%);">${inner}</div>`;
      }).join("");

      wheel.style.transform = `rotate(${wheelAngle}deg)`;
    }

    // 依目前轉盤角度，算出指針正下方是第幾個獎
    function prizeIndexUnderPointer() {
      const n = PRIZES.length;
      const seg = segmentAngle();
      const a = ((wheelAngle % 360) + 360) % 360;
      // 轉盤順時針轉 a 度後，停在上方的內容原本在 (360 - a)
      const atTop = (360 - a) % 360;
      return Math.floor(atTop / seg) % n;
    }

    function easeOutCubic(t) {
      return 1 - Math.pow(1 - t, 3);
    }

    function spinWheelTo(prizeIndex) {
      const wheel = document.getElementById("wheel");
      const stage = document.getElementById("wheel-stage");
      const targetCenter = segmentCenterDeg(prizeIndex);
      const extraSpins = 6 + Math.floor(Math.random() * 3);

      // 讓 targetCenter 轉到正上方：最終角度 ≡ -targetCenter (mod 360)
      const desiredMod = (360 - targetCenter) % 360;
      const current = ((wheelAngle % 360) + 360) % 360;
      let delta = desiredMod - current;
      if (delta < 0) delta += 360;
      // 避免剛好 0 度看起來沒轉
      if (delta < 20) delta += 360;
      delta += extraSpins * 360;

      const startAngle = wheelAngle;
      const endAngle = startAngle + delta;
      const duration = 5200;
      const start = performance.now();
      stage.classList.add("spinning");
      wheel.classList.add("spinning");

      return new Promise(resolve => {
        function frame(now) {
          const t = Math.min(1, (now - start) / duration);
          const eased = easeOutCubic(t);
          wheelAngle = startAngle + (endAngle - startAngle) * eased;
          wheel.style.transform = `rotate(${wheelAngle}deg)`;
          if (t < 1) {
            requestAnimationFrame(frame);
          } else {
            wheelAngle = endAngle;
            wheel.style.transform = `rotate(${wheelAngle}deg)`;
            stage.classList.remove("spinning");
            wheel.classList.remove("spinning");
            resolve(prizeIndexUnderPointer());
          }
        }
        requestAnimationFrame(frame);
      });
    }

    buildWheel();

    function renderChances() {
      const bar = document.getElementById("chances-bar");
      bar.innerHTML = Array.from({ length: MAX_DRAWS }, (_, i) =>
        `<div class="chance-dot ${i < state.used ? "used" : ""}" title="第 ${i + 1} 次"></div>`
      ).join("");
      document.getElementById("chances-left").textContent = remaining();
      const btn = document.getElementById("draw-btn");
      if (remaining() <= 0) {
        btn.disabled = true;
        btn.textContent = "抽獎機會已用完";
      } else if (spinning) {
        btn.disabled = true;
        btn.textContent = "抽獎中…";
      } else {
        btn.disabled = false;
        btn.textContent = "🎰 開始抽獎";
      }
    }

    function renderPrizes() {
      let mysteryIdx = 0;
      document.getElementById("prize-grid").innerHTML = PRIZES.map(p => {
        if (p.reveal) {
          return `<div class="prize-chip"><span class="emoji">${p.emoji}</span><span>${p.name}</span></div>`;
        }
        mysteryIdx += 1;
        return `<div class="prize-chip mystery"><span class="emoji">🎁</span><span>神秘獎品 #${mysteryIdx}</span></div>`;
      }).join("");
    }

    function renderHistory() {
      const el = document.getElementById("history");
      if (state.history.length === 0) {
        el.innerHTML = `<li class="history-empty">尚未抽獎，快來試試手氣！</li>`;
        return;
      }
      el.innerHTML = state.history.map((h, i) =>
        `<li class="history-item">
          <span class="history-round">#${i + 1}</span>
          <span class="emoji">${h.emoji}</span>
          <span>${h.name}${h.sub ? `（${h.sub}）` : ""}</span>
        </li>`
      ).join("");
    }

    function confetti() {
      const colors = ["#ffb020", "#ff7a18", "#ffcf4d", "#ff6b6b", "#2db86a", "#ff9f43"];
      for (let i = 0; i < 40; i++) {
        const el = document.createElement("div");
        el.className = "confetti";
        el.style.left = Math.random() * 100 + "vw";
        el.style.background = colors[Math.floor(Math.random() * colors.length)];
        el.style.animationDuration = (1.5 + Math.random() * 2) + "s";
        el.style.animationDelay = Math.random() * 0.5 + "s";
        el.style.borderRadius = Math.random() > 0.5 ? "50%" : "2px";
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 4000);
      }
    }

    function showResult(prize) {
      const cardEl = document.getElementById("result-card");
      const emojiEl = document.getElementById("result-emoji");
      const imgEl = document.getElementById("result-card-img");
      const subEl = document.getElementById("result-sub");
      const labelEl = document.getElementById("result-label");
      const spellFace = document.getElementById("spell-face");
      const scanNote = document.getElementById("spell-scan-note");
      const scanImg = document.getElementById("result-scan-img");

      cardEl.classList.remove("spell-mode");
      spellFace.classList.remove("show");
      scanNote.classList.remove("show");
      scanNote.open = false;
      imgEl.classList.remove("show");
      imgEl.removeAttribute("src");

      if (prize.spellCard) {
        const c = prize.spellCard;
        emojiEl.classList.add("hidden");
        emojiEl.textContent = "";
        cardEl.classList.add("spell-mode");

        document.getElementById("spell-face-no").textContent = c.id;
        document.getElementById("spell-face-name").innerHTML = `<small>咒語卡</small>${c.name}`;
        document.getElementById("spell-face-rank").textContent = `${c.rank}-${c.limit || "?"}`;
        document.getElementById("spell-face-desc").textContent = c.desc || "";
        document.getElementById("spell-face-icons").innerHTML =
          `<span class="gi-icon range">${c.range === "long" ? "遠" : "近"}</span>` +
          `<span class="gi-icon">咒</span>`;

        const artEl = document.getElementById("spell-face-art");
        const artSrc = spellImageSrc(c.id);
        artEl.src = artSrc;
        artEl.alt = "";
        artEl.onerror = () => {
          artEl.onerror = null;
          artEl.src = `../greed-island/images/modal/${c.id}.webp`;
        };

        spellFace.classList.add("show");

        scanImg.src = artSrc;
        scanImg.alt = `NO.${c.id} ${c.name} 原版掃描`;
        scanImg.onerror = () => {
          scanImg.onerror = null;
          scanImg.src = `../greed-island/images/modal/${c.id}.webp`;
        };
        scanNote.classList.add("show");
        scanNote.open = false;

        labelEl.textContent = "恭喜抽中咒語卡（中文卡面）";
        document.getElementById("result-prize").textContent = "";
        document.getElementById("result-prize").style.display = "none";
        subEl.classList.remove("show");
        subEl.textContent = "";
      } else if (prize.image) {
        emojiEl.classList.add("hidden");
        emojiEl.textContent = "";
        imgEl.src = prize.image;
        imgEl.alt = prize.name;
        imgEl.onerror = null;
        imgEl.classList.add("show");
        labelEl.textContent = "恭喜獲得";
        document.getElementById("result-prize").style.display = "";
        document.getElementById("result-prize").textContent = prize.name;
        subEl.classList.remove("show");
        subEl.textContent = "";
      } else {
        emojiEl.classList.remove("hidden");
        emojiEl.textContent = prize.emoji;
        labelEl.textContent = "恭喜獲得";
        subEl.classList.remove("show");
        subEl.textContent = "";
        document.getElementById("result-prize").style.display = "";
        document.getElementById("result-prize").textContent = prize.name;
      }

      document.getElementById("result-overlay").classList.add("show");
      confetti();
    }

    async function spin() {
      if (spinning || remaining() <= 0) return;
      spinning = true;
      renderChances();

      // 最後一次（第 3 抽）必定中貪婪之島咒語卡
      const isLastDraw = remaining() === 1;
      const intended = pickRandom(isLastDraw);
      const prizeIndex = Math.max(0, PRIZES.findIndex(p => p.id === intended.id));

      const landedIndex = await spinWheelTo(prizeIndex);
      // 以指針實際停到的扇形為準，避免畫面與開獎不一致
      const landed = PRIZES[landedIndex] || intended;
      const winner = resolvePrize(landed);
      await new Promise(r => setTimeout(r, 350));

      state.used++;
      state.history.push({
        id: winner.id,
        name: winner.name,
        emoji: winner.emoji,
        sub: winner.sub || "",
        spellId: winner.spellCard ? winner.spellCard.id : null,
      });
      saveState();

      spinning = false;
      renderChances();
      renderHistory();
      showResult(winner);
    }

    function resetDraws() {
      if (spinning) return;
      if (state.used === 0 && state.history.length === 0) return;
      if (!confirm("確定要重置嗎？會清空抽獎紀錄並恢復 3 次機會。")) return;
      state = { used: 0, history: [] };
      saveState();
      document.getElementById("result-overlay").classList.remove("show");
      renderChances();
      renderHistory();
    }

    document.getElementById("draw-btn").addEventListener("click", spin);
    document.getElementById("reset-btn").addEventListener("click", resetDraws);
    document.getElementById("result-close").addEventListener("click", () => {
      document.getElementById("result-overlay").classList.remove("show");
    });
    document.getElementById("result-overlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) e.currentTarget.classList.remove("show");
    });
