name: Publish TW 1m screener

on:
  workflow_dispatch:
  schedule:
    # 台北 09:05–13:50，週一到週五
    - cron: "5,20,35,50 1-5 * * 1-5"

permissions:
  contents: write

concurrency:
  group: tw-screener-publish
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python examples/scan_tw_1m.py -o docs/tw/index.html --quiet-empty
      - name: Commit page if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/tw/index.html
          git diff --staged --quiet || git commit -m "Update TW 1m screener page"
          git push
